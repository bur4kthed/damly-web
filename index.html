<!DOCTYPE html>
<html lang="tr" data-mod="sistem">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Damly – Akıllı Harcama Asistanı</title>
  <meta name="description" content="Damly: günlük harcama limiti, kumbara hedefleri ve kural tabanlı uzman sistemle çalışan akıllı harcama asistanı. Damlaya damlaya göl olur.">
  <meta name="theme-color" content="#F4F6FA">

  <!-- Telefonda "Ana ekrana ekle" ile uygulama gibi açılması için -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Damly">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="assets/damly-ikon-192.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="sahne">
    <!-- Masaüstünde telefonun yanında görünen tanıtım (telefonda gizlenir) -->
    <aside id="tanitim" class="tanitim"></aside>

    <div class="telefon">
      <div class="ekran-cam">
        <div class="durum-cubugu" aria-hidden="true">
          <span id="durum-saat">9:41</span>
          <span class="durum-ikonlar">
            <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
            <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.2-1.3A10.4 10.4 0 0 0 8 .4C5.2.4 2.7 1.5.8 3.3L2 4.6a8.6 8.6 0 0 1 6-2.4zm0 3.6c1.3 0 2.5.5 3.4 1.3l1.2-1.3A6.7 6.7 0 0 0 8 4c-1.8 0-3.4.7-4.6 1.8l1.2 1.3c.9-.8 2.1-1.3 3.4-1.3zM8 9.4 9.9 7.5a2.7 2.7 0 0 0-3.8 0z"/></svg>
            <svg width="27" height="13" viewBox="0 0 27 13" fill="none"><rect x=".5" y=".5" width="23" height="12" rx="3.5" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="18" height="9" rx="2" fill="currentColor"/><path d="M25 4.5v4c.8-.3 1.5-1.1 1.5-2s-.7-1.7-1.5-2z" fill="currentColor" opacity=".45"/></svg>
          </span>
        </div>
        <div class="dinamik-ada" aria-hidden="true"></div>
        <div id="uygulama" class="app"></div>
        <div class="ev-cizgisi" aria-hidden="true"></div>
      </div>
    </div>
  </div>

  <!-- Uzman sistem bileşenleri (sıralama önemli) -->
  <script src="js/veri.js"></script>       <!-- Sabitler, yardımcılar, veri saklama -->
  <script src="js/ikonlar.js"></script>    <!-- İkonlar ve logo -->
  <script src="js/borc.js"></script>       <!-- Borçlar: kredi kartı, taksit, KYK, kişiler -->
  <script src="js/takvim.js"></script>     <!-- Takvim ve dönem motoru: günlük limit -->
  <script src="js/gercekler.js"></script>  <!-- Çalışma belleği: gerçeklerin hesaplanması -->
  <script src="js/kurallar.js"></script>   <!-- Bilgi tabanı: EĞER–İSE kuralları -->
  <script src="js/motor.js"></script>      <!-- Çıkarım motoru: ileri zincirleme -->
  <script src="js/sahneler.js"></script>   <!-- Kurulum adımlarının hareketli çizimleri -->
  <script src="js/maskot.js"></script>     <!-- Asistanın işareti: logodaki damla ve su seviyesi -->
  <script src="js/rank.js"></script>       <!-- Rank: puan, Bronz–Elmas, kutlama ve paylaşma -->
  <script src="js/kurulum.js"></script>    <!-- İlk açılış (kurulum) ve rehberli tur -->
  <script src="js/alsam.js"></script>      <!-- "Alsam mı?" ve bekleme listesi -->
  <script src="js/ses.js"></script>        <!-- Sesle ya da cümleyle harcama ekleme -->
  <script src="js/fis.js"></script>        <!-- Fiş fotoğrafından harcama ekleme -->
  <script src="js/ekstre.js"></script>     <!-- Kart ekstresini yükleme ve eşleştirme -->
  <script src="js/hatirlatma.js"></script> <!-- Telefon bildirimleri: ödeme günleri, kararlar -->
  <script src="js/arayuz.js"></script>     <!-- Kullanıcı arayüzü + açıklama modülü -->
</body>
</html>
